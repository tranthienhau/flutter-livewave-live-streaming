<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    
    @keyframes floatUpOne {
      0% { transform: translateY(0) scale(0.7) rotate(-4deg); opacity: 0; }
      15% { opacity: 0.95; }
      65% { transform: translateY(-75px) scale(1.05) rotate(6deg); opacity: 0.9; }
      100% { transform: translateY(-135px) scale(0.85) rotate(-10deg); opacity: 0; }
    }
    @keyframes floatUpTwo {
      0% { transform: translateY(0) scale(0.6) rotate(6deg); opacity: 0; }
      20% { opacity: 0.9; }
      70% { transform: translateY(-90px) scale(1) rotate(-8deg); opacity: 0.85; }
      100% { transform: translateY(-160px) scale(0.75) rotate(12deg); opacity: 0; }
    }
    @keyframes floatUpThree {
      0% { transform: translateY(0) scale(0.8) rotate(-12deg); opacity: 0; }
      25% { opacity: 0.85; }
      60% { transform: translateY(-60px) scale(1.1) rotate(5deg); opacity: 0.8; }
      100% { transform: translateY(-115px) scale(0.9) rotate(-3deg); opacity: 0; }
    }
    .heart-float-1 { animation: floatUpOne 3.2s ease-in-out infinite; }
    .heart-float-2 { animation: floatUpTwo 3.8s ease-in-out infinite 1.1s; }
    .heart-float-3 { animation: floatUpThree 3.4s ease-in-out infinite 2.2s; }
    
    @keyframes softPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.7; }
    }
    .pulse-dot { animation: softPulse 1.8s ease-in-out infinite; }

    /* Custom hidden scrollbar */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
