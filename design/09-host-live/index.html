<!DOCTYPE html>

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .animate-live-dot {
      animation: pulseDot 1.4s ease-in-out infinite;
    }
    @keyframes floatSlideIn {
      0% { transform: translateY(12px) scale(0.96); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .gift-banner-pop {
      animation: floatSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-text-primary text-surface font-body antialiased flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- Mobile Canvas Device Shell (393px x 852px viewport) -->
<div class="relative w-full max-w-[393px] h-[852px] max-h-[852px] overflow-hidden rounded-none sm:rounded-[44px] shadow-2xl bg-black border-0 sm:border-[8px] sm:border-[#221c27]">
<!-- Full-Bleed Live Broadcast Host Camera Background -->
<div class="absolute inset-0 w-full h-full z-0">
<img alt="Host streaming live" class="w-full h-full object-cover object-center pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1XRvzLFzsb7RsLArlIEfgCPELVe_8Wp-rWamdSAGV_rcnrnX68uFZ5EwZevtnro9N24cvwPWgsPGZ45E47NsCPHg3QUP3M0Fd4TJZyxU0Wv3uG941x831tlhecMa_uMKJ2wGR5u9ucXPH7wUiaoLKEtPchhGHymR1o9lxhId4__GZOgKGzTb1Jgg9-6-I7E_XkrMjBOYXzzTHgTymjcd7S2_ZhiQxjmHj8Z4rfpLIx_MgFo5xxsT1KCQg"/>
<!-- Top Scrim Gradient for Control Visibility -->
<div class="absolute top-0 inset-x-0 h-44 bg-gradient-to-b from-black/80 via-black/35 to-transparent pointer-events-none"></div>
<!-- Bottom Scrim Gradient for Chat Legibility -->
<div class="absolute bottom-0 inset-x-0 h-[480px] bg-gradient-to-t from-black/90 via-black/45 to-transparent pointer-events-none"></div>
</div>
<!-- Main Live Streaming Host UI Layer -->
<div class="relative z-10 w-full h-full flex flex-col justify-between p-margin pt-[54px] pb-[34px]">
<!-- Top Overlay Controls Row -->
<header class="w-full flex flex-col gap-2">
<div class="flex items-center justify-between gap-1.5">
<!-- Left: LIVE Pill & Elapsed Stream Timer -->
<div class="flex items-center gap-1.5 bg-video-overlay backdrop-blur-md px-2 py-1 rounded-full border border-white/10 shadow-sm">
<span class="inline-flex items-center gap-1 bg-live-red px-2 py-0.5 rounded-full font-label text-[11px] font-bold text-surface tracking-wide uppercase">
<span class="w-1.5 h-1.5 rounded-full bg-surface animate-live-dot"></span>
              LIVE
            </span>
<span class="font-caption text-caption text-surface/90 font-medium pl-0.5 pr-1 tracking-tight">00:24:17</span>
</div>
<!-- Middle-Right: Viewers Count & Stream Quality Pill -->
<div class="flex items-center gap-1.5">
<!-- Viewers Pill -->
<div class="flex items-center gap-1 bg-video-overlay backdrop-blur-md px-2.5 py-1.5 rounded-full border border-white/10 shadow-sm">
<span class="material-symbols-outlined text-surface text-[16px]" data-icon="visibility">visibility</span>
<span class="font-caption text-caption text-surface font-semibold">1,034</span>
</div>
<!-- Health Status Chip -->
<div class="hidden xs:flex items-center gap-1.5 bg-video-overlay backdrop-blur-md px-2.5 py-1.5 rounded-full border border-white/10 shadow-sm">
<span class="w-2 h-2 rounded-full bg-secondary-fixed shadow-[0_0_8px_#c2f18a]"></span>
<span class="font-caption text-[11px] text-surface/90 font-medium whitespace-nowrap">3.2 Mbps</span>
</div>
<!-- End Stream Button -->
<button class="flex items-center justify-center bg-live-red hover:bg-red-700 active:scale-95 transition-all duration-150 px-3 py-1.5 rounded-full shadow-md font-label text-caption font-bold text-surface">
              End
            </button>
</div>
</div>
<!-- Sub-row: Network Health Indicator (Visible on small screens) -->
<div class="flex items-center justify-between px-1">
<div class="flex items-center gap-1.5 bg-video-overlay backdrop-blur-sm px-2 py-0.5 rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-[#22C55E]"></span>
<span class="font-caption text-[11px] text-surface/90">Excellent Network</span>
</div>
<div class="flex items-center gap-2">
<span class="font-caption text-[11px] text-surface/80 bg-video-overlay backdrop-blur-sm px-2 py-0.5 rounded-full">720p HD · 60fps</span>
</div>
</div>
</header>
<!-- Center Space: Focal Gift Alert Banner (mid-left floating anchor) -->
<div class="w-full my-auto flex flex-col items-start pointer-events-none">
<div class="gift-banner-pop pointer-events-auto flex items-center gap-2.5 bg-secondary-fixed text-text-primary px-3 py-2 rounded-full shadow-lg border border-secondary-fixed-dim/40 max-w-[90%]">
<!-- Crown Icon Bubble -->
<div class="w-7 h-7 rounded-full bg-text-primary flex items-center justify-center text-secondary-fixed shadow-inner shrink-0">
<span class="material-symbols-outlined text-[17px]" data-icon="hotel_class">hotel_class</span>
</div>
<!-- Gift Text Content -->
<div class="flex flex-col pr-1">
<div class="flex items-center gap-1.5">
<span class="font-label text-[13px] font-bold tracking-tight text-text-primary">Sofia</span>
<span class="font-caption text-[11px] font-semibold bg-text-primary/10 px-1.5 py-0.2 rounded-full">Crown x1</span>
</div>
<span class="font-caption text-[11px] text-text-primary/80 font-medium">+500 coins added</span>
</div>
<!-- Coin Badge -->
<span class="material-symbols-outlined text-[#755b00] text-[20px] ml-auto shrink-0" data-icon="monetization_on">monetization_on</span>
</div>
</div>
<!-- Bottom Region: Live Stream Chat, Moderation Popover & Broadcast Host Controls -->
<div class="w-full flex flex-col gap-3">
<!-- Live Comments Stack with Contextual Host Moderation Popover -->
<div class="flex flex-col gap-2 w-full max-w-[340px]">
<!-- Pinned Stream Comment -->
<div class="flex items-start gap-2 bg-video-overlay backdrop-blur-md p-2 rounded-2xl border border-primary-container/60 shadow-md">
<div class="w-6 h-6 rounded-full bg-primary-container flex items-center justify-center text-surface shrink-0 mt-0.5 shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="push_pin">push_pin</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center gap-1">
<span class="font-label text-[11px] font-semibold text-primary-fixed-dim">Pinned</span>
<span class="font-caption text-[11px] text-surface/60">· Ava</span>
</div>
<p class="font-caption text-caption text-surface font-medium leading-tight break-words">what coffee beans do you use?</p>
</div>
</div>
<!-- Normal Chat Bubble 1 -->
<div class="flex items-center gap-2 bg-video-overlay backdrop-blur-md px-2.5 py-1.5 rounded-2xl border border-white/5 w-fit max-w-[85%] shadow-sm">

<div class="font-caption text-caption leading-tight text-surface">
<span class="font-semibold text-surface/75 mr-1.5">Kenji</span>
<span>good morning! ☀️</span>
</div>
</div>
<!-- Moderation Popover Item (Anchor: Marco's comment) -->
<div class="relative w-fit">
<!-- Host Moderation Floating Action Card (Active State Popover) -->
<div class="mb-1.5 flex items-center gap-1 bg-surface text-text-primary px-2 py-1.5 rounded-full shadow-xl border border-border-hairline animate-fade-in z-20">
<button class="flex items-center gap-1 px-2 py-1 rounded-full text-text-secondary hover:bg-surface-alt active:scale-95 text-[11px] font-medium transition-all">
<span class="material-symbols-outlined text-[14px] text-primary" data-icon="keep">keep</span>
                Pin
              </button>
<span class="w-[1px] h-3 bg-outline-variant/60"></span>
<button class="flex items-center gap-1 px-2 py-1 rounded-full text-text-secondary hover:bg-surface-alt active:scale-95 text-[11px] font-medium transition-all">
<span class="material-symbols-outlined text-[14px] text-text-secondary" data-icon="mic_off">mic_off</span>
                Mute
              </button>
<span class="w-[1px] h-3 bg-outline-variant/60"></span>
<button class="flex items-center gap-1 px-2 py-1 rounded-full text-danger-text hover:bg-danger-fill active:scale-95 text-[11px] font-semibold transition-all">
<span class="material-symbols-outlined text-[14px] text-danger-text" data-icon="delete">delete</span>
                Remove
              </button>
</div>
<!-- The Targeted Comment Bubble -->
<div class="flex items-center gap-2 bg-video-overlay backdrop-blur-md px-2.5 py-1.5 rounded-2xl border border-primary-container ring-1 ring-primary-container/40 w-fit shadow-md">
<img class="w-5 h-5 rounded-full object-cover shrink-0" data-alt="Authentic headshot portrait photo of Marco, a smiling Mediterranean man in a navy jacket in an espresso bar, clean warm daylight, photorealistic social media avatar." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6-N7_suN4PL8bDabiht9BiiodSL5aAbrvF50p--DmO5GzMnw4taU-ddP8iYuiFxWErF-ZEZFbkimpOFKn9uZ-87mBSL940BekjQ5j_lc2pccrgm2TS8DaPhKNbpzINVMwbDVNeZeQiSrp1MhkrtHJaOaeuKmc3DsYLNPNwdNgaODSj0e1EiitOxldaiGOqxwNLLAwUSrBy9cY110gKsZQS5W7n-04gnJeMePy0Ft0MdYOmXY8QByIpMmPFNTwBWRyc9ZHcUxFusU"/>
<div class="font-caption text-caption leading-tight text-surface">
<span class="font-semibold text-primary-fixed-dim mr-1.5">Marco</span>
<span>from Madrid 🇪🇸</span>
</div>
</div>
</div>
<!-- Normal Chat Bubble 3 (Using provided Avatar) -->
<div class="flex items-center gap-2 bg-video-overlay backdrop-blur-md px-2.5 py-1.5 rounded-2xl border border-white/5 w-fit max-w-[85%] shadow-sm">
<img alt="Maya Chen" class="w-5 h-5 rounded-full object-cover shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1XPQQ2q8t-klPXo736dHVYaVQJ-MKLuR2t4it3VhwmJqIoLScaUdvdI3sb2qJDSVC_8ETBKq9VkpAIavkbP4XoxRJhoyEfaJlD2hRVZckE0jtxTpqI0MhGjeb8hlL9OKWAom1Ar2MiJUpFF6Tq11yXjtNtHxQeShTOe4iRV1hlOUYWAUYmBgSak2M96WX6v7RUTyYPrwNIRRCGUa3jPBkOmVig4pHOlE9T0v4p1dfLnK4N2-l65KIFly6M"/>
<div class="font-caption text-caption leading-tight text-surface">
<span class="font-semibold text-surface/75 mr-1.5">Aiko</span>
<span>love the setup</span>
</div>
</div>
</div>
<!-- Host Bottom Action Control Toolbar (NO Bottom Navigation Bar / Tab Bar) -->
<div class="w-full pt-1 flex items-center justify-between px-1">
<!-- 1. Microphone Toggle (Active with green dot) -->
<button class="relative w-12 h-12 rounded-full bg-video-overlay backdrop-blur-md border border-white/15 flex items-center justify-center text-surface hover:bg-white/20 active:scale-90 transition-all shadow-md">
<span class="material-symbols-outlined text-[22px]" data-icon="mic">mic</span>
<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-secondary-fixed ring-2 ring-black/40"></span>
</button>
<!-- 2. Flip Camera Switch -->
<button class="w-12 h-12 rounded-full bg-video-overlay backdrop-blur-md border border-white/15 flex items-center justify-center text-surface hover:bg-white/20 active:scale-90 transition-all shadow-md">
<span class="material-symbols-outlined text-[22px]" data-icon="flip_camera_ios">flip_camera_ios</span>
</button>
<!-- 3. Beauty / Filter Sparkle Icon -->
<button class="w-12 h-12 rounded-full bg-video-overlay backdrop-blur-md border border-white/15 flex items-center justify-center text-surface hover:bg-white/20 active:scale-90 transition-all shadow-md">
<span class="material-symbols-outlined text-[22px]" data-icon="auto_awesome">auto_awesome</span>
</button>
<!-- 4. Stream Health Pulse Wave -->
<button class="w-12 h-12 rounded-full bg-video-overlay backdrop-blur-md border border-white/15 flex items-center justify-center text-surface hover:bg-white/20 active:scale-90 transition-all shadow-md">
<span class="material-symbols-outlined text-[22px]" data-icon="vital_signs">vital_signs</span>
</button>
<!-- 5. Chat Compose / Toggle -->
<button class="w-12 h-12 rounded-full bg-accent-fill hover:bg-accent-pressed active:scale-90 border border-primary-fixed-dim/40 flex items-center justify-center text-surface transition-all shadow-lg">
<span class="material-symbols-outlined text-[22px]" data-icon="chat_bubble">chat_bubble</span>
</button>
</div>
</div>
</div>
<!-- Mobile Home Indicator Bar (Visual Anchor) -->
<div class="absolute bottom-2 inset-x-0 flex justify-center pointer-events-none z-30">
<div class="w-32 h-1 bg-white/40 rounded-full"></div>
</div>
</div>
</body></html>
